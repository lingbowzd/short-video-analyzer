[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "short-video-analyzer"
version = "0.1.0"
description = "Efficient, metadata-aware summarization for short-form social media videos."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "Short Video Analyzer contributors"}
]
keywords = ["video summarization", "short-form video", "social media", "multimodal", "research"]
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
video = [
  "opencv-python>=4.8",
  "pillow>=10.0",
  "moviepy>=1.0",
  "scenedetect[opencv]>=0.6",
]
openai = ["openai>=1.0"]
azure = ["azure-cognitiveservices-speech>=1.34"]
whisper = ["openai-whisper>=20231117"]
local = [
  "transformers>=4.40",
  "torch>=2.1",
  "accelerate>=0.29",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
  "mkdocs>=1.5",
  "mkdocs-material>=9.5",
]
all = [
  "short-video-analyzer[video,openai,azure,whisper,local]",
]

[project.urls]
Homepage = "https://github.com/lingbow/short-video-analyzer"
Repository = "https://github.com/lingbow/short-video-analyzer"
Issues = "https://github.com/lingbow/short-video-analyzer/issues"

[tool.setuptools.packages.find]
include = ["short_video_analyzer*"]

[tool.ruff]
line-length = 100

